# サイトのリポジトリでは .github/workflows/deploy.yml に置く。
# main に変更が入るたびに、記事を JSON にして Cloudflare に公開し、変わったページのキャッシュだけを入れ替える。
# 何も変わっていなければ（ハッシュが前回と同じなら）、公開を飛ばす。
#
# 必要な Secrets: CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID、PURGE_TOKEN
# 必要な Variables: SITE_URL（例: https://media.example.com）
name: deploy

on:
  push:
    branches: [main]
  # 予約投稿のとき、Claude のスケジュールタスクがこれで動かす
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 記事ごとの変換結果と前回の manifest。なくても動く（全部を変換し、公開中の manifest と比べる）
      - name: 前回のビルドの結果を読み込む
        uses: actions/cache/restore@v5
        with:
          path: .cache
          key: build-${{ github.run_id }}
          restore-keys: build-

      - name: 記事を JSON にする
        id: build
        env:
          PREV_MANIFEST_URL: ${{ vars.SITE_URL }}/manifest.json
        run: pnpm run build

      - name: 公開
        if: steps.build.outputs.changed == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: キャッシュを入れ替えて温める
        if: steps.build.outputs.changed == 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PURGE_TOKEN: ${{ secrets.PURGE_TOKEN }}
        run: node scripts/purge-and-warm.mjs --verify

      - name: 変更がなかった
        if: steps.build.outputs.changed != 'true'
        run: echo "記事と一覧のハッシュが前回と同じなので、公開を飛ばしました"

      # 公開まで成功したときだけ保存する（失敗した回の manifest を次の比較に使わない）
      - name: ビルドの結果を保存する
        uses: actions/cache/save@v5
        with:
          path: .cache
          key: build-${{ github.run_id }}
