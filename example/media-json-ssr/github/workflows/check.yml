# サイトのリポジトリでは .github/workflows/check.yml に置く。
# プルリクエストで「ビルドが通るか」と「書き手が自分の記事だけを変えたか」だけを確かめる。
# ルールセットで、この permissions のチェックと編集者（CODEOWNERS）の承認を必須にする。
name: check

on:
  pull_request:

permissions:
  contents: read

jobs:
  permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: ビルドが通るか
        run: pnpm run build

      - name: 変えてよいファイルだけか
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          git fetch origin main
          node scripts/sync-permissions.mjs check-pr "$AUTHOR" $(git diff --name-only origin/main...HEAD)
