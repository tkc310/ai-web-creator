# 版のタグを打ち、リリースを作って zip を添付する（README の「版の付け方」の手順5〜7）。
# zip には、参照しているスキル（skills/web-creator/references/external-skills.txt）も入れる。
# Claude Code のクラウドのセッションではタグの push とリリースの作成が断られるため、
# 作者が GitHub の画面の Actions → release → Run workflow から、手で動かす。自動では動かない。
# 動かす前に、CHANGELOG.md の版の見出しの日付と MANIFEST.txt を main に入れておく（手順2）。
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "打つタグ（例 v2026.11.1）。CHANGELOG.md の版の見出しと MANIFEST.txt の tag の行に合わせる"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: 道具を入れる
        run: python3 -m pip install --quiet pyyaml

      - name: タグと版の見出しを確かめる
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]+$ ]] || { echo "::error::タグの形が vYYYY.MM.N ではありません: $TAG"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::$TAG はすでにあります"; exit 1
          fi
          head="$(grep -m1 '^## ' CHANGELOG.md)"
          [[ "$head" =~ ^"## $TAG（"[0-9]{4}-[0-9]{2}-[0-9]{2}"）"$ ]] \
            || { echo "::error::CHANGELOG.md のいちばん上の見出しが「## $TAG（YYYY-MM-DD）」ではありません: $head"; exit 1; }
          grep -qx "# tag: $TAG" MANIFEST.txt \
            || { echo "::error::MANIFEST.txt の「# tag:」が $TAG ではありません"; exit 1; }
          python3 .github/scripts/check_skills.py --manifest

      - name: タグを打つ
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"

      - name: zip を作ってリリースに添付する
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          git archive --format=tar "$TAG" skills LICENSE CHANGELOG.md | tar -x -C "$out"
          # 参照しているスキル（design-nexus）を、その版の external-skills.txt のコミットで zip に入れる（clone できない作業環境の B の経路のため）
          bash "$out/skills/web-creator/scripts/fetch_external_skills.sh" "$out/skills"
          printf 'source: https://github.com/%s\ntag: %s\ncommit: %s\n' "$GITHUB_REPOSITORY" "$TAG" "$(git rev-list -n 1 "$TAG")" > "$out/VERSION"
          (cd "$out" && zip -qr "ai-web-creator-$TAG.zip" skills LICENSE CHANGELOG.md VERSION)
          sed -n "/^## $TAG/,/^## /p" CHANGELOG.md | sed '$d' > "$out/notes.md"
          gh release create "$TAG" "$out/ai-web-creator-$TAG.zip" --title "$TAG" --notes-file "$out/notes.md" --verify-tag
