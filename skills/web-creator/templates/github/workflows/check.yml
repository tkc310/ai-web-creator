# プルリクエスト（依存パッケージの更新、GitHub Actions の更新、保守や振り返りの修正など）で、ビルドが通るかだけを確認する。
# すべてのサイトに置く。
name: check

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # pnpm のバージョンは package.json の packageManager から読む（HTML だけのサイトでは使わない）
      - name: pnpm を用意する
        if: hashFiles('package.json') != ''
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}

      - name: ビルド
        run: |
          if [ -f package.json ]; then
            pnpm install --frozen-lockfile
            pnpm run build
          fi
