# main ブランチに変更が入るたびに、ビルドして Cloudflare に公開する。
# CI で確認するのは「ビルドが通るか」だけにして、失敗しにくくしている。
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ビルド
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run build
          else
            echo "HTML だけのサイトなのでビルドは不要です"
          fi

      - name: 公開
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
