# main ブランチに変更が入るたびに、ビルドして Cloudflare に公開する。
# CI で確認するのは「ビルドが通るか」だけにして、失敗しにくくしている。
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # pnpm のバージョンは package.json の packageManager から読む（HTML だけのサイトでは使わない）
      - name: pnpm を用意する
        if: hashFiles('package.json') != ''
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}

      - name: ビルド
        run: |
          if [ -f package.json ]; then
            pnpm install --frozen-lockfile
            pnpm run build
          else
            echo "HTML だけのサイトなのでビルドは不要です"
          fi

      - name: 公開
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
