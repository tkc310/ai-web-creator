# pnpm の設定（サイトのリポジトリの直下に pnpm-workspace.yaml として置く）。
# 1つのサイトだけのリポジトリでも、pnpm の設定はこのファイルに書く。

# 公開から1日（1440分）たっていない版は入れない（pnpm 11 以降の既定値。明示しておく）。
# 公開直後に乗っ取られた版を入れてしまう、サプライチェーン攻撃を避けるため。
minimumReleaseAge: 1440

# 依存パッケージのインストール時のスクリプトは、ここで許可したものだけを動かす（pnpm の既定は全部止める）。
# 許可するのは、ビルドに必要な実行ファイルを用意するものだけにする。増やすときは、何をするスクリプトかを確かめてから。
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
