# pnpm の設定（サイトのリポジトリの直下に pnpm-workspace.yaml として置く）。
# 1つのサイトだけのリポジトリでも、pnpm の設定はこのファイルに書く。

# 公開から3日（4320分）たっていない版は入れない（pnpm 11 以降の既定値は1日。長くしている）。
# 公開直後に乗っ取られた版を入れてしまう、サプライチェーン攻撃を避けるため。乗っ取られた版は、多くが数日のうちに見つかって取り下げられる。
# 重大な弱点を直す版が3日たっていないときは、待つか、その版だけ minimumReleaseAgeExclude に足すかをオーナーに確かめる（runtime-update）。
minimumReleaseAge: 4320

# 依存パッケージのインストール時のスクリプトは、ここで許可したものだけを動かす（pnpm の既定は全部止める）。
# 許可するのは、ビルドに必要な実行ファイルを用意するものだけにする。増やすときは、何をするスクリプトかを確かめてから。
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
